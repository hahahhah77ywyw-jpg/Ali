name: Flexible Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          unzip -o AlOthmanySender_Project.zip -d extracted_project
          GRADLE_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$GRADLE_DIR" ]; then
            echo "تم العثور على مجلد المشروع: $GRADLE_DIR"
            mv $GRADLE_DIR/* . 2>/dev/null || true
            mv $GRADLE_DIR/.* . 2>/dev/null || true
          else
            mv extracted_project/* . 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug || ./gradlew assemble
          else
            echo "لم يتم العثور على ملف تشغيل محلي، سيتم البناء باستخدام أداة Gradle العامة السحابية..."
            gradle assembleDebug || gradle assemble || gradle build
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-App-APK
          path: "**/*.apk"
