name: Flexible Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          unzip -o AlOthmanySender_Project.zip -d extracted_project
          GRADLE_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$GRADLE_DIR" ]; then
            echo "تم العثور على مجلد المشروع: $GRADLE_DIR"
            mv $GRADLE_DIR/* . 2>/dev/null || true
            mv $GRADLE_DIR/.* . 2>/dev/null || true
          else
            mv extracted_project/* . 2>/dev/null || true
          fi

      # استخدام إصدار Java 11 الأكثر استقراراً مع مشاريع وتطبيقات الهواتف
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # جعل الأداة تستخدم إصدار Gradle المكتوب داخل مشروعك بدلاً من فرض إصدار حديث
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon || ./gradlew assemble --no-daemon
          else
            gradle assembleDebug --no-daemon || gradle assemble --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-App-APK
          path: "**/*.apk"
