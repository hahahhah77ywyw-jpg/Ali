name: Perfect Match Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. إعداد بيئة الجافا المتقدمة وإعطائها أقصى طاقة من الرام للسيرفر
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle' # تفعيل كاش جرادل تلقائياً لتسريع البناء 10 مرات في المرات القادمة

    - name: Unzip Project File
      run: |
        unzip -o AlOthmanySender_Project.zip
        GRADLE_DIR=$(find . -name "build.gradle" -exec dirname {} \;)
        if [ -n "$GRADLE_DIR" ]; then
          echo "تم العثور على مجلد المشروع: $GRADLE_DIR"
          # الانتقال لمجلد المشروع إذا لم يكن في المسار الرئيسي
          cd $GRADLE_DIR
        fi

    # 2. توليد وتفعيل ملف إعدادات تسريع المعالجة (gradle.properties) داخل السيرفر
    - name: Inject Performance Gradle Settings
      run: |
        echo "org.gradle.parallel=true" >> gradle.properties
        echo "org.gradle.caching=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
        echo "org.gradle.vfs.watch=false" >> gradle.properties

    # 3. إعطاء صلاحيات التشغيل لملف البناء
    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    # 4. بناء التطبيق بـ "كامل القوة" وبأمر إخراج النسخة النهائية المغلقة والمحسنة (Release)
    - name: Build with Gradle Powerful Commands
      run: ./gradlew assembleRelease --parallel --build-cache --daemon

    # 5. رفع ملف الـ APK الناتج لتتمكن من تحميله مباشرة من جيثب مية مية
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: AlOthmanySender-Ultimate
        path: "**/build/outputs/apk/release/*.apk"
