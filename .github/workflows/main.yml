name: Fixed Safe Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          unzip -o AlOthmanySender_Project.zip -d extracted_project
          GRADLE_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$GRADLE_DIR" ]; then
            echo "تم العثور على مجلد المشروع: $GRADLE_DIR"
            mv $GRADLE_DIR/* . 2>/dev/null || true
            mv $GRADLE_DIR/.* . 2>/dev/null || true
          else
            mv extracted_project/* . 2>/dev/null || true
          fi

      # 1. تثبيت جافا 11 المستقرة والمناسبة للمشروع
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 2. إجبار نظام GitHub السحابي على خفض إصدار البناء إلى 7.5 المتوافق مع تطبيقك
      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      # 3. تشغيل أمر بناء الـ APK بأمان وتخطي الفحوصات الحديثة
      - name: Build APK
        run: |
          gradle assembleDebug -x lint -x test --no-daemon || gradle assemble -x lint -x test --no-daemon

      # 4. رفع واستخراج ملف الـ APK عند إتمام البناء بنجاح
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final-App-APK
          path: "**/*.apk"
